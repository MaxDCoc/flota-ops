name: flota-ops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flota_local}
      POSTGRES_DB: flota
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flota} -d flota"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    mem_limit: 128m

  # Analítica de mantenimiento (repo propio), construida desde GitHub.
  # Su config.go exige un archivo .env junto al binario, por eso se monta uno.
  voltcare:
    build: ./voltcare
    volumes:
      - ./voltcare/voltcare.env:/app/voltcare-api/.env:ro
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 1g

  n8n:
    image: n8nio/n8n:1.123.94
    entrypoint: ["/bin/sh", "/opt/flota/n8n/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
      voltcare:
        condition: service_started
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-flota}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-flota_local}
      POSTGRES_USER: ${POSTGRES_USER:-flota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flota_local}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-flota-ops-clave-local-no-usar-en-produccion}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/opt/flota/n8n:ro
      - ./workflows:/opt/flota/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 768m

volumes:
  pgdata:
  n8n_data:
